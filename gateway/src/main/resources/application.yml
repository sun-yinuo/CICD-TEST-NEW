server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.0.81:8848
        namespace: public
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: test-service-route
              uri: lb://test-service
              predicates:
                - Path=/test/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: '*'
